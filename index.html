function vG(){if(!S.p)return vP();if(AD.progressView==='calendar')return vCal();if(AD.progressView==='stats')return vStats();if(AD.progressView==='weight')return vWeight();const t=T(),w=S.w,last=w[w.length-1];let h=`<h1>Progreso</h1><div class="card weightEntryCard"><button class="weightEntryLink" data-a="weightopen"><span><b>Registrar peso</b><small>${last?`Último registro: ${last.w} kg · ${new Date(last.d+'T12:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'})}`:'Sumá una medición para ver tu tendencia.'}</small></span><svg class="forwardArrow" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`;if(t.teen){h+='<div class="card"><h2>Seguimiento y crecimiento</h2><p>La app muestra tus registros de peso, pero no calcula una velocidad objetivo ni una fecha para alcanzar el peso indicado. En menores, la interpretación requiere curvas de crecimiento por edad y sexo.</p><div class="source">Si elegiste aumentar o bajar de peso, revisá la meta con pediatra o nutricionista antes de seguirla.</div></div>'}else{const r=slope();h+='<div class="card"><h2>Tendencia</h2>';if(last)h+=`<p>Peso actual: <b>${last.w} kg</b>${w.length>1?` (${R(last.w-w[0].w,1)>0?'+':''}${R(last.w-w[0].w,1)} kg desde el inicio)`:''}</p>`;if(r==null)h+='<p class="mu">Cargá tu peso al menos 2 veces en más de 5 días para ver tu ritmo semanal.</p>';else{const dev=r-t.wk,g=S.p.g;h+=`<p>Ritmo real: <b>${r>0?'+':''}${R(r,2)} kg/sem</b> · Previsto: ${t.wk>0?'+':''}${R(t.wk,2)} kg/sem</p><p>${Math.abs(dev)<.15?'Vas en ritmo con tu plan. Mantené.':g=='l'?(dev>0?'Bajás más lento de lo previsto: revisá el plan con un profesional.':'Bajás más rápido de lo previsto: revisá el plan con un profesional.'):(dev>0?'Subís más rápido de lo previsto. Revisá el plan con un profesional.':'Subís más lento de lo previsto. Revisá el plan con un profesional.')}</p>`;if(S.p.tw&&last){const rem=S.p.tw-last.w;if(Math.abs(rem)<.3)h+='<p><b>¡Llegaste a tu peso objetivo!</b></p>';else if(r*rem>0)h+=`<p>Te faltan ${R(Math.abs(rem),1)} kg: unas <b>${Math.ceil(rem/r)} semanas</b> a este ritmo.</p>`}}if(last&&Math.abs(last.w-S.p.w)>=1)h+=`<button class="bt" data-a="up">Actualizar mi plan con ${last.w} kg</button>`;h+='</div>'}const ks=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const dd=S.l[dk(d)];if(dd?.complete&&!empty(dd))ks.push(tot(dd))}h+=`<div class="card"><h2>Últimos 7 días</h2>`+(ks.length?`<p>Completaste <b>${ks.length}</b> de 7 días.</p><p>Promedio: <b>${R(ks.reduce((s,x)=>s+x.k,0)/ks.length)}</b> kcal (meta ${t.k}) · <b>${R(ks.reduce((s,x)=>s+x.p,0)/ks.length)}</b> g de proteína (meta ${t.pr})</p>`:'<p class="mu">Todavía no hay días completos con comidas registradas esta semana.</p>')+'</div>';h+='<div class="card monthStatsCard"><button class="monthStatsLink" data-a="statsopen"><span><b>Estadísticas del mes</b><small>Gráficos y observaciones de tus registros</small></span><i>›</i></button></div>';h+='<div class="card trainingMonthCard"><button class="calendarPreview" data-a="calopen"><span class="calendarPreviewText"><b>Entrenamientos</b><small>Tu actividad en el calendario mensual.</small></span><span class="calendarPreviewAction">Ver calendario <svg class="forwardArrow" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></div>';if(w.length)h+='<div class="card"><h2>Historial</h2>'+w.slice(-8).reverse().map(x=>`<div class="en" data-a="dw" data-d="${x.d}"><span>${x.d}</span><em>${x.w} kg</em></div>`).join('')+'<small>Tocá un registro para revisar la opción de eliminarlo.</small></div>';return h}
