function monthReportData(month){const [yy,mm]=month.split('-').map(Number),daysInMonth=new Date(yy,mm,0).getDate(),now=today(),nowMonth=now.slice(0,7),periodDays=month===nowMonth?+now.slice(8,10):daysInMonth,days=[];for(let n=1;n<=periodDays;n++){const key=`${month}-${String(n).padStart(2,'0')}`,d=S.l[key],hasFood=!!d&&Object.values(d.m||{}).some(a=>a&&a.length);days.push({n,key,d,complete:!!(d&&d.complete),hasFood,food:hasFood?tot(d):null,water:d&&d.complete&&+d.h>0?+d.h:null,trained:!!(d&&d.t)})}const completeDays=days.filter(x=>x.complete),foodDays=days.filter(x=>x.complete&&x.hasFood),waterDays=days.filter(x=>x.water!=null),trainingDays=days.filter(x=>x.trained),sum=(arr,k)=>arr.reduce((a,x)=>a+(+x.food[k]||0),0),target=T(),waterGoal=Math.round(35*(+S.p.w||0)/250)*250,average=(arr,k)=>arr.length?sum(arr,k)/arr.length:null,weights=S.w.filter(x=>x.d.startsWith(month)&&+x.d.slice(8,10)<=periodDays).sort((a,b)=>a.d<b.d?-1:1),goalDays=foodDays.filter(x=>{const k=+x.d.completeTargets?.k||target.k;return Math.abs(x.food.k-k)<=k*.1}),firstWeights=weights.filter(x=>+x.d.slice(8,10)<=7),lastWeights=weights.filter(x=>+x.d.slice(8,10)>Math.max(0,periodDays-7)),weightAvg=a=>a.length?a.reduce((q,x)=>q+(+x.w||0),0)/a.length:null,weightComparison=periodDays>=14&&firstWeights.length&&lastWeights.length?{first:weightAvg(firstWeights),last:weightAvg(lastWeights),delta:weightAvg(lastWeights)-weightAvg(firstWeights)}:null;return{month,daysInMonth,periodDays,days,completeDays,foodDays,waterDays,trainingDays,weights,avgK:average(foodDays,'k'),avgP:average(foodDays,'p'),avgC:average(foodDays,'c'),avgWater:waterDays.length?waterDays.reduce((a,x)=>a+x.water,0)/waterDays.length:null,target,avgTargetK:foodDays.length?foodDays.reduce((a,x)=>a+(+x.d.completeTargets?.k||target.k),0)/foodDays.length:target.k,avgTargetP:foodDays.length?foodDays.reduce((a,x)=>a+(+x.d.completeTargets?.p||target.pr),0)/foodDays.length:target.pr,waterGoal,goalDays,expectedSessions:(+S.p.d||0)*periodDays/7,weightCom function vStats(){const month=AD.statsMonth||today().slice(0,7),d=monthReportData(month),notes=monthNotes(d),title=new Date(month+'-01T12:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'}),metric=AD.statsMetric||'k',prev=new Date(month+'-01T12:00');prev.setMonth(prev.getMonth()-1);const prevKey=dk(prev).slice(0,7),next=new Date(month+'-01T12:00');next.setMonth(next.getMonth()+1);const nextKey=dk(next).slice(0,7),canNext=nextKey<=today().slice(0,7),tabs=[['k','Energía'],['p','Proteína'],['h','Agua'],['w','Peso'],['t','Entrenamientos']];return `<div class="progressHeading"><button class="backProgress" data-a="statsback"><svg class="backArrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Volver a progreso</span></button><h1>Estadísticas del mes</h1><p>Una lectura clara de tus registros, sin completar los días vacíos con suposiciones.</p></div><section class="card monthlyReport"><div class="monthReportNav"><button data-a="statsmonth" data-v="-1" aria-label="Mes anterior">‹</button><b>${title}</b><button data-a="statsmonth" data-v="1" aria-label="Mes siguiente" ${canNext?'':'disabled'}>›</button></div><small class="reportPeriod">${d.periodDays?`Datos del 1 al ${d.periodDays} · ${d.completeDays.length} días marcados completos · ${d.foodDays.length} con comidas`:'Todavía no hay días transcurridos en este período'}</small><div class="monthMetricTabs">${tabs.map(([v,label])=>`<button data-a="statsmetric" data-v="${v}" class="${metric===v?'selected':''}">${label}</button>`).join('')}</div><div class="monthChartWrap">${monthStatChart(d,metric)}</div><div class="monthQuickStats"><div><small>Días completos</small><b>${d.completeDays.length} <em>/ ${d.periodDays} transcurridos</em></b></div><div><small>Días dentro de meta kcal</small><b>${d.goalDays.length} <em>/ ${d.foodDays.length} completos</em></b></div><div><small>Entrenamientos</smal let c;if(n==6){const i=PAR.indexOf(par);if(i<0)return null;c=i+d.join('')}else{if(par!=='LLLL')return null;c=d.join('')}return chk(c)?c:null}
function decF(r,fb){for(let i=fb?0:1;i+3<r.length;i+=2){const m=(r[i]+r[i+1]+r[i+2])/3;if(m<1||i<1||r[i-1]<m*3)continue;if([0,1,2].some(k=>r[i+k]<.45*m||r[i+k]>1.8*m))continue;for(const n of[6,4]){const c=rd(r,i+3,n);if(c)return c}}return null}
function dec(r,fb){return decF(r,fb)||decF(r.slice().reverse(),(r.length-1)%2==0?fb:!fb)}
function slide(a,W,mx){const n=a.length,o=new Float32Array(n),q=new Int32Array(n);let h=0,t=0;for(let i=0,j=0;i<n;i++){const hi=Math.min(n-1,i+W);while(j<=hi){while(t>h&&(mx?a[q[t-1]]<=a[j]:a[q[t-1]]>=a[j]))t--;q[t++]=j++}while(q[h]<i-W)h++;o[i]=a[q[h]]}return o}
function runs(g){const n=g.length;if(n<80)return null;const s=new Float32Array(n);for(let i=0;i<n;i++)s[i]=(g[Math.max(0,i-1)]+2*g[i]+g[Math.min(n-1,i+1)])/4;const W=Math.max(30,n>>4),hi=slide(s,W,1),lo=slide(s,W,0),d=new Float32Array(n);for(let i=0;i<n;i++)d[i]=hi[i]-lo[i]<20?1:s[i]-(hi[i]+lo[i])/2;
const cr=[];for(let i=1;i<n;i++)if((d[i-1]<0)!==(d[i]<0))cr.push(i-1+Math.abs(d[i-1])/(Math.abs(d[i-1])+Math.abs(d[i])));if(cr.length<30)return null;const r=[cr[0]];for(let i=1;i<cr.length;i++)r.push(cr[i]-cr[i-1]);r.push(n-1-cr[cr.length-1]);return{r,fb:d[0]<0}}
function toGray(im){const o=im.data,G=new Uint8Array(im.width*im.height);for(let i=0,j=0;j<G.length;i+=4,j++)G[j]=(o[i]*77+o[i+1]*150+o[i+2]*29)>>8;return G}
function scan(G,w,h,deep){const out={},A=deep?[0,-6,6,-12,12,-20,20,-30,30,90,84,96,76,104]:[0,-8,8,-18,18,90,82,98],N=deep?34:18,cx=w/2,cy=h/2,L=Math.hypot(w,h)/2;
for(const a of A){const t=a*Math.PI/180,c=Math.cos(t),s=Math.sin(t),ext=Math.abs(c)*h+Math.abs(s)*w;for(let k=0;k<N;k++){const o=((k+.5)/N-.5)*.8*ext,line=[];for(let u=-L;u<=L;u++){const x=cx+u*c-o*s,y=cy+u*s+o*c;if(x>=0&&y>=0&&x<w-1&&y<h-1)line.push(G[(y|0)*w+(x|0)])}const q=runs(line);if(!q)continue;const code=dec(q.r,q.fb);if(code)out[code]=(out[code]||0)+1}}return out}
function best(o){let b=null,n=0;for(const k in o)if(o[k]>n){n=o[k];b=k}return b?[b,n]:null}
const BD=('BarcodeDetector' in window)?(()=>{try{return new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']})}catch(e){return null}})():null;

let ST=null;
window.stopScan=()=>{if(!ST)return;ST.dead=1;clearTimeout(ST.tm);try{ST.stream.getTracks().forEach(t=>t.stop())}catch(e){}ST=null;const b=Q('#scanBox');if(b)b.hidden=true;const c=Q('#scanCtl');if(c)c.hidden=true;const g=Q('#scanGo');if(g)g.hidden=false};

async function frameCode(src,w,h,deep){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);const r=best(scan(toGray(x.getImageData(0,0,w,h)),w,h,deep));if(r&&(r[0].length==13||r[1]>=2))return r;if(BD){try{const d=await BD.detect(cv);if(d[0]&&chk(d[0].rawValue)&&/^\d{8,13}$/.test(d[0].rawValue))return[d[0].rawValue,2]}catch(e){}}return null}
async function start(){window.stopScan();const box=Q('#scanBox'),vid=Q('#scanVid');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Este navegador no permite usar la cámara acá. Usá “Sacar foto del código” o escribí el número.','err');return}
let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}catch(e){msg('No pudimos abrir la cámara. Permití el acceso a la cámara para este sitio, o usá “Sacar foto del código” o escribí el número.','err');return}
if(!Q('#scanVid')){stream.getTracks().forEach(t=>t.stop());return}
const st=ST={stream,votes:[]};vid.srcObject=stream;box.hidden=false;Q('#scanCtl').hidden=false;Q('#scanGo').hidden=true;msg('Centrá el código dentro del marco y mantené firme el teléfono.');
const tr=stream.getVideoTracks()[0];try{await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}try{const cp=tr.getCapabilities();if(cp.torch)Q('#scanTorch').hidden=false;if(cp.zoom&&cp.zoom.max>=2)await tr.applyConstraints({advanced:[{zoom:Math.min(2,cp.zoom.max)}]})}catch(e){}
try{await vid.play()}catch(e){}
const tick=async()=>{if(st.dead)return;if(!Q('#scanVid')){window.stopScan();return}
if(vid.videoWidth){const sc=Math.min(1,1280/vid.videoWidth),w=Math.round(vid.videoWidth*sc),h=Math.round(vid.videoHeight*sc),r=await frameCode(vid,w,h,false),now=Date.now();if(st.dead)return;if(r){st.votes.push([r[0],now,r[1]]);st.votes=st.votes.filter(v=>now-v[1]<2500);const n=st.votes.filter(v=>v[0]===r[0]).reduce((a,v)=>a+v[2],0);if(n>=2){navigator.vibrate&&navigator.vibrate(60);window.stopScan();lookup(r[0]);return}}}
st.tm=setTimeout(tick,60)};tick()}
const nf=x=>x==null||x===''||isNaN(+x)?null:+x;
function toFood(code,p){const n=p.nutriments||{},sq=nf(p.serving_quantity),pq=nf(p.product_quantity),R2=x=>x==null?null:Math.round(x*100)/100,per=(k,m=1)=>{let x=nf(n[k+'_100g']);if(x==null&&sq>0){const y=nf(n[k+'_serving']);if(y!=null)x=y*100/sq}return x==null?null:x*m};
let k=per('energy-kcal');if(k==null){const kj=per('energy-kj')??per('energy');if(kj!=null)k=kj/4.184}const P=per('proteins'),C=per('carbohydrates'),F=per('fat');
let na=per('sodium',1000);if(na==null){const sa=per('salt');if(sa!=null)na=sa*400}
const nm=(p.product_name_es||p.product_name||p.generic_name_es||p.generic_name||'').trim(),br=(p.brands||'').split(',')[0].trim(),full=nm?(br&&!nm.toLowerCase().includes(br.toLowerCase())?nm+' · '+br:nm):(br||'Producto '+code);
const ports=[];if(sq>0)ports.push(['Porción del envase',sq]);if(pq>0&&pq!==sq)ports.push(['Envase completo',pq]);
const ok=[k,P,C,F].every(x=>x!=null),f={id:'o'+code,n:full,es:full,bc:code,k:R2(k),p:R2(P),c:R2(C),f:R2(F),s:sq>0?sq:(pq>0&&pq<=500?pq:100),u:'100 g',src:'Open Food Facts · código '+code,official:true,portions:ports,micro:{fiber:R2(per('fiber')),sugar:R2(per('sugars')),sodium:R2(na),satFat:R2(per('saturated-fat')),cholesterol:R2(per('cholesterol',1000)),potassium:R2(per('potassium',1000)),calcium:R2(per('calcium',1000)),iron:R2(per('iron',1000))}};
Object.keys(f.micro).forEach(k=>{if(f.micro[k]==null)delete f.micro[k]});return{f,ok,name:full}}
async function off(code){const Fl='product_name,product_name_es,generic_name,generic_name_es,brands,quantity,product_quantity,serving_quantity,nutriments';let err=0;for(const h of['world','ar']){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),9000),r=await fetch(`https://${h}.openfoodfacts.org/api/v2/product/${code}.json?fields=${Fl}`,{signal:c.signal});clearTimeout(t);if(r.status==404)return{nf:1};if(!r.ok){err=1;continue}const j=await r.json();if(j.status===1&&j.product)return{p:j.product};if(j.status===0)return{nf:1}}catch(e){err=1}}return err?{err:1}:{nf:1}}
function form(code,name,pref,note){const v=(k)=>pref&&pref[k]!=null?pref[k]:'';return `<div class="scanMsg ${pref?'':'warn'}">${note}</div><div class="scanForm" data-code="${code}"><label>Nombre del producto<input id="bn" type="text" value="${esc(name||'')}" placeholder="Ej.: Galletitas Formis 200 g"></label><label>Peso de la porción (g)<input id="bs" type="number" inputmode="decimal" value="${pref?100:''}" placeholder="30"></label><div class="g2"><label>Energía por porción (kcal)<input id="bk" type="number" inputmode="decimal" value="${v('k')}"></label><label>Proteína (g)<input id="bp" type="number" inputmode="decimal" value="${v('p')}"></label><label>Carbohidratos (g)<input id="bh" type="number" inputmode="decimal" value="${v('c')}"></label><label>Grasas (g)<input id="bf" type="number" inputmode="decimal" value="${v('f')}"></label><label>Fibra (g, opcional)<input id="bfi" type="number" inputmode="decimal"></label><label>Sodio (mg, opcional)<input id="bso" type="number" inputmode="decimal"></label></div><button class="bt" data-a="bcSave">Guardar con este código</button></div>`}
async function lookup(code){if(code.length==12)code='0'+code;const loc=S.cf.find(x=>x.bc===code);if(loc){AD.f=loc;det();return}
const box=Q('#scanRes');if(box)msg(`Buscando el código ${code}…`,'busy');const cand=[code];if(code.length==13&&code[0]=='0')cand.push(code.slice(1));let res={nf:1};for(const c of cand){res=await off(c);if(res.p||res.err)break}
if(!Q('#scanRes'))return;if(res.p){const t=toFood(code,res.p);if(t.ok&&t.f.p+t.f.c+t.f.f<=106){const est=4*t.f.p+4*t.f.c+9*t.f.f,bad=Math.abs(t.f.k-est)>Math.max(45,.35*est);S.cf.unshift(t.f);sv();AD.f=t.f;det();const s=Q('#sh .source');if(s)s.insertAdjacentHTML('afterend',`<div class="scanMsg ${bad?'warn':''}">${bad?'Los valores de la base no coinciden entre sí: comprobalos con tu envase. ':'Revisá que coincida con tu envase. '}<button data-a="bcFix" data-code="${code}">Corregir con la etiqueta</button></div>`);return}
Q('#scanRes').innerHTML=form(code,t.name,null,`Encontramos <b>${esc(t.name)}</b>, pero la base no trae sus nutrientes completos. Copialos de la etiqueta; queda guardado con el código.`);return}
Q('#scanRes').innerHTML=form(code,'',null,res.err?'No pudimos consultar la base (sin conexión o sin respuesta). Podés cargarlo ahora desde la etiqueta: queda guardado con el código '+code+' y la próxima vez se reconoce solo, incluso sin internet.':`El código <b>${code}</b> todavía no está en Open Food Facts. Cargalo desde la etiqueta: queda guardado y la próxima vez se reconoce solo.`)}
Object.assign(A,{scanStart:start,scanStop:()=>window.stopScan(),scanTorch:async()=>{if(!ST)return;const tr=ST.stream.getVideoTracks()[0];ST.torch=!ST.torch;try{await tr.applyConstraints({advanced:[{torch:ST.torch}]})}catch(e){}},
bcm:()=>{const c=($('#bcm').value||'').replace(/\D/g,'');if(![8,12,13].includes(c.length)){msg('Escribí los 8, 12 o 13 números que figuran debajo de las barras.','err');return}if(!chk(c.length==12?'0'+c:c)){msg('Ese número no es un código válido. Revisá que no falte o sobre ningún dígito.','err');return}lookup(c)},
